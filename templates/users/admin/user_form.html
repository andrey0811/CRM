{% extends "base.html" %}

{% block title %}{{ title }} — Admin{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="form">
    {% csrf_token %}
    {% for field in form %}
    <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Saqlash</button>
    <a href="{% url 'admin-user-list' %}" class="btn btn-secondary">Orqaga</a>
</form>
{% endblock %}
